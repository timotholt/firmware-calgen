[project]
name = "firmware-calgen"
version = "0.1.0"
description = "Spec-to-firmware constants: traceable, gated, reviewed."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Timothy Otholt" }]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
ai = ["openai>=1.0", "anthropic>=0.40"]

[project.scripts]
calgen = "calgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pypdf>=6.21.0",
    "reportlab>=5.0.1",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
