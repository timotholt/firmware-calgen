# How each firmware constant is derived.
#
# Names in formulas:
#   ds.*      data sheet field (public, cited)          design.*  engineer-supplied design value
#   board.*   control-board sense chain (invented)      target.*  processor profile
#   <id>      any constant defined earlier in this file
#
# format: float32 | uintN | intN | iqN | qM.N | target (= the target's default_format)
# min/max are in the constant's own unit. tolerance = max relative quantization error.
# Formulas are textbook relations; the AC output stage is sensed with a mid-rail
# bias, so its usable range is +/- v_ref/2 around the bias point.

# LaTeX symbols for inputs in typeset derivations (constants use their own `latex`).
symbols:
  ds.power_va: 'S'
  ds.vout_nom: 'V_{\text{out,nom}}'
  ds.vout_tol_pct: 'k_{\text{reg}}'
  ds.vin_min: 'V_{\text{in,min}}^{\text{DS}}'
  ds.vin_max: 'V_{\text{in,max}}^{\text{DS}}'
  ds.iin_max: 'I_{\text{in,max}}^{\text{DS}}'
  ds.fout_hz: 'f_{\text{out}}^{\text{DS}}'
  ds.overload_alarm_pct: 'k_{\text{alarm}}'
  ds.overload_trip_pct: 'k_{\text{trip}}'
  ds.batt_string_v: 'V_{\text{bat}}^{\text{DS}}'
  board.r_shunt: 'R_{\text{sh}}'
  board.g_amp: 'G_{\text{amp}}'
  board.vbus_r_top: 'R_{\text{bus,top}}'
  board.vbus_r_bot: 'R_{\text{bus,bot}}'
  board.vout_r_top: 'R_{\text{out,top}}'
  board.vout_r_bot: 'R_{\text{out,bot}}'
  board.vbat_r_top: 'R_{\text{bat,top}}'
  board.vbat_r_bot: 'R_{\text{bat,bot}}'
  target.v_ref: 'V_{\text{ref}}'
  target.adc_max: 'N_{\text{ADC}}'
  target.dac_max: 'N_{\text{DAC}}'
  target.f_pwmclk: 'f_{\text{clk}}'
  design.f_sw: 'f_{\text{sw}}'
  design.t_deadband: 't_{\text{DB}}'
  design.vbus_margin: 'm_{\text{bus}}'
  design.sense_headroom: 'h'
  design.cell_cutoff_v: 'V_{\text{cell,cut}}'
  design.cell_full_v: 'V_{\text{cell,full}}'
  ds.batt_series_cells: 'n_{\text{cells}}'
  design.pk_limit_factor: 'k_{\text{pk}}'
  design.overload_delay: 't_{\text{OL}}'
  target.db_max: 'N_{\text{DB,max}}'
  design.vloop_kp: 'K_P'
  design.vloop_ki: 'K_I'

blocks:
  in:   AC input
  rect: Rectifier / PFC
  bus:  DC bus
  inv:  Inverter
  out:  AC output
  batt: Battery
  ctl:  Control loop (engineer-supplied)

constants:
  # --- AC input -----------------------------------------------------------
  - id: vin_min
    symbol: UPS_VIN_MIN_V
    describe: Lowest input voltage the unit runs on before transferring to battery
    formula: ds.vin_min
    unit: V
    format: target
    block: in
    latex: 'V_{\text{in,min}}'
    min: 50
    max: 300

  - id: vin_max
    symbol: UPS_VIN_MAX_V
    describe: Highest input voltage the unit accepts
    formula: ds.vin_max
    unit: V
    format: target
    block: in
    latex: 'V_{\text{in,max}}'
    min: 50
    max: 300

  - id: iin_limit
    symbol: UPS_IIN_LIMIT_A
    describe: Input current limit (data sheet maximum input current)
    formula: ds.iin_max
    unit: A
    format: target
    block: in
    latex: 'I_{\text{in,max}}'
    min: 0.5
    max: 50

  # --- Rectifier / PFC ----------------------------------------------------
  - id: vbus_min
    symbol: UPS_VBUS_MIN_V
    describe: A boost PFC stage must hold the bus above the peak of the highest input voltage
    formula: sqrt(2) * vin_max
    unit: V
    format: target
    block: rect
    latex: 'V_{\text{bus,min}}'
    min: 50
    max: 500

  # --- DC bus -------------------------------------------------------------
  - id: vbus_set
    symbol: UPS_VBUS_SET_V
    describe: DC bus regulation setpoint, bus minimum plus design margin, rounded up to 10 V
    formula: ceil(vbus_min * (1 + design.vbus_margin) / 10) * 10
    unit: V
    format: target
    block: bus
    latex: 'V_{\text{bus,set}}'
    min: 50
    max: 500

  - id: vbus_fs
    symbol: UPS_VBUS_FS_V
    describe: Bus voltage at ADC full scale (divider ratio times ADC reference)
    formula: target.v_ref * (board.vbus_r_top + board.vbus_r_bot) / board.vbus_r_bot
    unit: V
    format: target
    block: bus
    latex: 'V_{\text{bus,FS}}'
    min: 50
    max: 1000

  - id: vbus_scale
    symbol: UPS_VBUS_V_PER_COUNT
    describe: Volts of bus per ADC count
    formula: vbus_fs / target.adc_max
    unit: V
    format: target
    block: bus
    latex: 'k_{\text{bus}}'
    tolerance: 0.0001

  # --- Inverter -----------------------------------------------------------
  - id: vout_set
    symbol: UPS_VOUT_SET_V
    describe: Output voltage setpoint (RMS); for units with a selectable output, one header is generated per option
    formula: ds.vout_nom
    unit: V
    format: target
    block: inv
    latex: 'V_{\text{out}}'
    min: 100
    max: 250

  - id: vout_lo
    symbol: UPS_VOUT_LO_V
    describe: Lower edge of the data sheet output regulation band
    formula: vout_set * (1 - ds.vout_tol_pct)
    unit: V
    format: target
    block: inv
    latex: 'V_{\text{out,lo}}'

  - id: vout_hi
    symbol: UPS_VOUT_HI_V
    describe: Upper edge of the data sheet output regulation band
    formula: vout_set * (1 + ds.vout_tol_pct)
    unit: V
    format: target
    block: inv
    latex: 'V_{\text{out,hi}}'

  - id: vout_fs_pk
    symbol: UPS_VOUT_FS_PK_V
    describe: Peak output voltage at the edge of the mid-rail-biased sense range
    formula: target.v_ref / 2 * (board.vout_r_top + board.vout_r_bot) / board.vout_r_bot
    unit: V
    format: target
    block: inv
    latex: 'V_{\text{out,FS}}'

  - id: fout_hz
    symbol: UPS_FOUT_HZ
    describe: Output frequency
    formula: ds.fout_hz
    unit: Hz
    format: target
    block: inv
    latex: 'f_{\text{out}}'
    min: 45
    max: 450

  - id: fout_mode
    kind: enum
    symbol: UPS_FOUT_MODE
    describe: Changer regenerates a fixed frequency; follower tracks the input
    source: ds.fout_mode
    choices: {changer: UPS_FOUT_CHANGER, follower: UPS_FOUT_FOLLOWER}
    block: inv

  - id: pwm_period
    symbol: UPS_PWM_PERIOD_CNT
    describe: PWM period register, up-down (center-aligned) count mode as usual for inverters (TBPRD = f_clk / (2 f_sw))
    formula: round(target.f_pwmclk / (2 * design.f_sw))
    unit: counts
    format: uint16
    block: inv
    latex: 'N_{\text{PWM}}'
    min: 100

  - id: pwm_deadband
    symbol: UPS_PWM_DEADBAND_CNT
    describe: Dead-time register
    formula: round(design.t_deadband * target.f_pwmclk)
    unit: counts
    format: uint16
    block: inv
    latex: 'N_{\text{DB}}'
    min: 1

  # --- AC output ----------------------------------------------------------
  - id: iout_rated
    symbol: UPS_IOUT_RATED_A
    describe: Rated output current (RMS)
    formula: ds.power_va / ds.vout_nom
    unit: A
    format: target
    block: out
    latex: 'I_{\text{rated}}'
    min: 0.5
    max: 100

  - id: iout_alarm
    symbol: UPS_IOUT_ALARM_A
    describe: Overload alarm current (RMS)
    formula: iout_rated * ds.overload_alarm_pct
    unit: A
    format: target
    block: out
    latex: 'I_{\text{alarm}}'
    optional: true

  - id: iout_trip
    symbol: UPS_IOUT_TRIP_A
    describe: Software overload trip level (RMS, timed; acts after UPS_OVERLOAD_DELAY_MS above this level)
    formula: iout_rated * ds.overload_trip_pct
    unit: A
    format: target
    block: out
    latex: 'I_{\text{trip}}'

  - id: overload_delay
    symbol: UPS_OVERLOAD_DELAY_MS
    describe: Time above the RMS trip level before the overload action (the data sheet gives no time)
    formula: design.overload_delay
    unit: ms
    format: uint32
    block: out
    latex: 't_{\text{OL}}'
    min: 100
    max: 600000

  - id: iout_pk_limit
    symbol: UPS_IOUT_PK_LIMIT_A
    describe: Hardware peak-current limit (fast comparator, short-circuit protection); must clear the crest factor of rated nonlinear loads
    formula: design.pk_limit_factor * iout_rated
    unit: A
    format: target
    block: out
    latex: 'I_{\text{pk,lim}}'

  - id: iout_fs_pk
    symbol: UPS_IOUT_FS_PK_A
    describe: Peak current at the edge of the mid-rail-biased current-sense range
    formula: target.v_ref / 2 / (board.r_shunt * board.g_amp)
    unit: A
    format: target
    block: out
    latex: 'I_{\text{FS}}'

  - id: iout_pklim_dac_hi
    symbol: UPS_IOUT_PKLIM_DAC_HI
    describe: Comparator DAC code for the positive hardware peak-current limit
    formula: round((target.v_ref / 2 + iout_pk_limit * board.r_shunt * board.g_amp) / target.v_ref * target.dac_max)
    unit: counts
    format: uint16
    block: out
    latex: 'N_{\text{DAC,hi}}'

  - id: iout_pklim_dac_lo
    symbol: UPS_IOUT_PKLIM_DAC_LO
    describe: Comparator DAC code for the negative hardware peak-current limit
    formula: round((target.v_ref / 2 - iout_pk_limit * board.r_shunt * board.g_amp) / target.v_ref * target.dac_max)
    unit: counts
    format: uint16
    block: out
    latex: 'N_{\text{DAC,lo}}'

  - id: overload_action
    kind: enum
    symbol: UPS_OVERLOAD_ACTION
    describe: What the unit does when the RMS overload persists past the delay
    source: ds.overload_action
    choices: {shutdown: UPS_OL_SHUTDOWN, bypass: UPS_OL_BYPASS}
    block: out

  # --- Battery ------------------------------------------------------------
  - id: vbat_nom
    symbol: UPS_VBAT_NOM_V
    describe: Battery string nominal voltage
    formula: ds.batt_string_v
    unit: V
    format: target
    block: batt
    latex: 'V_{\text{bat}}'
    min: 12
    max: 400

  - id: vbat_cutoff
    symbol: UPS_VBAT_CUTOFF_V
    describe: Low-battery shutdown voltage
    formula: ds.batt_series_cells * design.cell_cutoff_v
    unit: V
    format: target
    block: batt
    latex: 'V_{\text{bat,cut}}'

  - id: vbat_fs
    symbol: UPS_VBAT_FS_V
    describe: Battery voltage at ADC full scale
    formula: target.v_ref * (board.vbat_r_top + board.vbat_r_bot) / board.vbat_r_bot
    unit: V
    format: target
    block: batt
    latex: 'V_{\text{bat,FS}}'

  # --- Control loop (engineer-supplied, carried through) -------------------
  - id: vloop_kp
    symbol: UPS_VLOOP_KP
    describe: Voltage-loop proportional gain (tuned by power engineering)
    formula: design.vloop_kp
    unit: ratio
    format: target
    block: ctl
    latex: 'K_P'
    supplied: true
    min: 0
    max: 10

  - id: vloop_ki
    symbol: UPS_VLOOP_KI
    describe: Voltage-loop integral gain per control ISR (tuned by power engineering)
    formula: design.vloop_ki
    unit: ratio
    format: target
    block: ctl
    latex: 'K_I'
    supplied: true
    min: 0
    max: 1

checks:
  - id: bus_above_output_peak
    describe: The inverter can only make an output peak lower than the DC bus
    lhs: sqrt(2) * vout_hi
    op: "<"
    rhs: vbus_set
    block: bus

  - id: bus_sense_range
    describe: Bus setpoint must sit inside the bus sensor's range with headroom
    lhs: vbus_set
    op: "<="
    rhs: design.sense_headroom * vbus_fs
    block: bus

  - id: vout_sense_range
    describe: Output peak at the top of the regulation band must sit inside the output sensor's range
    lhs: sqrt(2) * vout_hi
    op: "<="
    rhs: design.sense_headroom * vout_fs_pk
    block: inv

  - id: iout_sense_range
    describe: Hardware peak limit must sit inside the current sensor's range, or the sensor saturates before the limit fires
    lhs: iout_pk_limit
    op: "<="
    rhs: design.sense_headroom * iout_fs_pk
    block: out

  - id: overload_below_pk_limit
    describe: The timed RMS overload must act before the hardware limit, so normal overloads don't trip the fast protection
    lhs: sqrt(2) * iout_trip
    op: "<"
    rhs: iout_pk_limit
    block: out

  - id: dac_hi_in_range
    describe: Positive peak-limit DAC code must exist on this chip's comparator DAC
    lhs: iout_pklim_dac_hi
    op: "<="
    rhs: target.dac_max
    block: out

  - id: deadband_in_range
    describe: Dead-time count must fit this chip's dead-band counter
    lhs: pwm_deadband
    op: "<="
    rhs: target.db_max
    block: inv

  - id: alarm_below_trip
    describe: Overload alarm must come before the trip
    lhs: iout_alarm
    op: "<"
    rhs: iout_trip
    block: out

  - id: vbat_sense_range
    describe: A fully charged battery must sit inside the battery sensor's range
    lhs: ds.batt_series_cells * design.cell_full_v
    op: "<="
    rhs: design.sense_headroom * vbat_fs
    block: batt

  - id: cutoff_below_nominal
    describe: Low-battery cutoff must be below nominal
    lhs: vbat_cutoff
    op: "<"
    rhs: vbat_nom
    block: batt
