board: ups_ctrl
rev: B
description: >
  INVENTED control board for the demo, revision B: the rev A current-sense amplifier is unavailable and the qualified alternate has a gain of 20 V/V. Sense-chain values are plausible
  textbook choices, not from any real product. Simplified sensing: dividers and
  the shunt are drawn referenced to the controller. On an isolated unit (FA10507)
  a real design senses on the primary side or through isolation amplifiers or
  current transformers; the scale-factor math is the same.
params:
  r_shunt:     {value: 2, unit: mohm, note: "output current shunt; range must cover the hardware peak limit (~3.5x rated RMS)"}
  g_amp:       {value: 20, unit: ratio, note: "current-sense amplifier gain (alternate part, rev B)"}
  vbus_r_top:  {value: 1.5, unit: Mohm, note: DC bus divider, top}
  vbus_r_bot:  {value: 10, unit: kohm, note: DC bus divider, bottom}
  vout_r_top:  {value: 1.0, unit: Mohm, note: AC output divider, top (mid-rail biased)}
  vout_r_bot:  {value: 3.3, unit: kohm, note: AC output divider, bottom}
  vbat_r_top:  {value: 499, unit: kohm, note: battery divider, top}
  vbat_r_bot:  {value: 10, unit: kohm, note: battery divider, bottom}
