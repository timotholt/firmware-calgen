variant: fa10507_revB
description: FA10507 (1500 VA) on control board rev B (alternate current-sense amplifier)
datasheet: ../datasheets/fa10507.csv
board: ../boards/ups_ctrl_revB.yaml
target: ../targets/f28004x.yaml
design:
  f_sw:              {value: 20, unit: kHz, note: inverter switching frequency (power engineering choice)}
  t_deadband:        {value: 1, unit: us, note: gate-drive dead time for an IGBT bridge (power engineering choice)}
  vbus_margin:       {value: 7, unit: "%", note: DC bus setpoint margin above rectified input peak}
  sense_headroom:    {value: 95, unit: "%", note: max fraction of sensor full scale a limit may use}
  cell_cutoff_v:     {value: 2.5, unit: V, note: "LiFePO4 per-cell discharge cutoff, generic chemistry figure"}
  cell_full_v:       {value: 3.65, unit: V, note: "LiFePO4 per-cell full-charge voltage, generic chemistry figure"}
  pk_limit_factor:   {value: 3.5, unit: ratio, note: "hardware peak limit / rated RMS current: clears the rated crest factor with margin (checked)"}
  crest_factor:      {value: 3, unit: ratio, note: "peak / RMS of a rated computer-type (capacitor-input rectifier) load; 3:1 is the usual UPS rating, assumed"}
  m_max:             {value: 95, unit: "%", note: "maximum inverter modulation index (room for dead time and device drop), assumed"}
  overload_delay:    {value: 30, unit: s, note: "time at the RMS trip level before the overload action; invented, the data sheet gives none"}
  vloop_kp:          {value: 0.8, unit: ratio, note: "voltage-loop proportional gain (engineer-tuned, invented)", designed_against: {design.f_sw: 20 kHz}}
  vloop_ki:          {value: 0.015, unit: ratio, note: "voltage-loop integral gain per ISR (engineer-tuned, invented)", designed_against: {design.f_sw: 20 kHz}}
