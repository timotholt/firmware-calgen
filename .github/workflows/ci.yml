name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Python tests
        run: uv run pytest
      - name: Firmware build and known-answer test
        if: hashFiles('firmware/Makefile') != ''
        run: make -C firmware test CC=gcc
