name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Fetch and verify pinned site assets
        run: uv run calgen vendor
      - name: Python tests (includes generated-file freshness and recorded AI replay)
        run: uv run pytest
      - name: Firmware build and known-answer test (gcc stands in for TI Code Composer Studio)
        run: make -C firmware test CC=gcc
